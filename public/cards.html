<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>QRカード印刷 | IT部 CASINO</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="cards-print">
  <div class="print-controls">
    <b>QRカード印刷</b>
    開始 <input id="from" type="number" min="1" value="1">
    枚数 <input id="count" type="number" min="1" max="500" value="50">
    <button class="btn small" id="reload">作成</button>
    <button class="btn small" onclick="print()">印刷する</button>
    <span id="msg"></span>
  </div>
  <div id="sheets"></div>
  <script type="module">
    import { request } from './js/api.js';
    import { el, clear } from './js/ui.js';
    const q = new URLSearchParams(location.search);
    const $from = document.getElementById('from');
    const $count = document.getElementById('count');
    $from.value = q.get('from') || 1;
    $count.value = q.get('count') || 50;
    let token = null;
    try { token = localStorage.getItem('casino.adminToken'); } catch {}
    async function build() {
      const msg = document.getElementById('msg');
      msg.textContent = '作成中…';
      try {
        const r = await request('GET', `/api/admin/cards?from=${$from.value}&count=${$count.value}`, undefined, { 'x-admin-token': token || '' });
        const sheets = [];
        for (let i = 0; i < r.cards.length; i += 10) {
          sheets.push(el('div.sheet', r.cards.slice(i, i + 10).map((c) => el('div.qcard',
            el('div.qr', { html: c.svg }),
            el('div',
              el('div.suits', '♠ ♥ ♦ ♣'),
              el('div.t', 'IT部 CASINO'),
              el('div.id', c.id),
              el('div.code', c.code),
              el('div.info', 'ゲーム機のカメラにQRをかざしてね', el('br'), 'チップは2日間有効・換金性なし', el('br'), 'カードはなくさないでね（再発行不可）'))))));
        }
        clear(document.getElementById('sheets'), sheets);
        msg.textContent = `${r.cards.length}枚（${sheets.length}ページ）`;
      } catch (e) {
        msg.textContent = e.status === 401 ? '管理画面でログインしてから開いてください' : e.message;
      }
    }
    document.getElementById('reload').onclick = build;
    build();
  </script>
</body>
</html>
