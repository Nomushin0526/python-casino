<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ランキング | IT部 CASINO</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">
  <script type="module" src="js/ranking.js"></script>
</head>
<body class="ranking">
  <div class="rank-wrap">
    <div class="rank-head">
      <h1>🏆 最高チップ ランキング</h1>
      <div class="stats" id="stats"></div>
    </div>
    <div class="rank-body">
      <div class="rank-list" id="top"></div>
      <div class="rank-side">
        <div class="rank-sub" id="sub"></div>
        <div>
          <h2>🔥 最近の大勝ち</h2>
          <div class="feed" id="feed"></div>
        </div>
      </div>
    </div>
    <div class="rank-foot"><span>2日間通しの「最高到達チップ数」で順位を決定 ／ チップに換金性はありません</span><span id="updated"></span></div>
  </div>
</body>
</html>
